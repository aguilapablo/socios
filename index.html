<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MATU AGUILA">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<title>MATU AGUILA · Collection Report</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23faf8f3'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23a8842f' font-family='Georgia' font-weight='bold'%3EMA%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,700;0,6..96,900;1,6..96,500&family=Oswald:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #ffffff;
    --bg-2: #ffffff;
    --panel: #ffffff;
    --panel-2: #f6f4ef;
    --line: #e2ddd0;
    --line-soft: #eeebe3;
    --gold: #a8842f;
    --gold-bright: #c8a24a;
    --gold-dim: #c4b48a;
    --ivory: #1a1814;
    --ash: #6b665c;
    --ash-dim: #9a9488;
    --crimson: #a8362f;
    --crimson-soft: #f7e8e6;
    --emerald: #2f7a52;
    --emerald-soft: #e6f2eb;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  html, body {
    background: #ffffff;
    color: var(--ivory);
    font-family: 'Oswald', sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: contain;
    color-scheme: light only;
  }

  body {
    padding: 0 0 calc(var(--safe-bottom) + 96px);
    min-height: 100vh;
    background: #ffffff;
  }

  /* ===== HEADER ===== */
  .header {
    position: relative;
    padding: calc(var(--safe-top) + 20px) 22px 22px;
    background: var(--bg-2);
    border-bottom: 1px solid var(--line);
    overflow: hidden;
  }

  .header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .eyebrow-line { flex: 1; height: 1px; background: var(--line); }

  .eyebrow-text {
    font-size: 9.5px;
    font-weight: 500;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
    white-space: nowrap;
  }

  .masthead {
    text-align: center;
    margin-bottom: 4px;
  }

  .masthead .name {
    font-family: 'Anton', sans-serif;
    font-size: 52px;
    font-weight: 400;
    line-height: 0.9;
    letter-spacing: 1px;
    color: var(--ivory);
    text-transform: uppercase;
    background: linear-gradient(180deg, #1a1814 0%, #1a1814 60%, #5a4a20 140%);
    -webkit-background-clip: text;
    background-clip: text;
  }

  .masthead .name .amp {
    color: var(--gold);
    font-style: italic;
    font-weight: 500;
  }

  .masthead .sub {
    font-family: 'Oswald', sans-serif;
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--ash);
    margin-top: 8px;
  }

  /* Metrics strip */
  .metrics {
    display: grid;
    grid-template-columns: 1fr 1px 1fr 1px 1fr;
    align-items: center;
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--line-soft);
  }

  .metric { text-align: center; }
  .metric .val {
    font-family: 'Bodoni Moda', serif;
    font-size: 26px;
    font-weight: 700;
    line-height: 1;
    color: var(--ivory);
    font-variant-numeric: tabular-nums;
  }
  .metric .val.gold { color: var(--gold); }
  .metric .val .val-sub { font-size: 14px; color: var(--ash-dim); font-weight: 400; }
  .metric .lbl {
    font-size: 8.5px;
    font-weight: 400;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--ash-dim);
    margin-top: 6px;
  }
  .metric-div { height: 34px; background: var(--line-soft); }

  /* progress hairline */
  .prog {
    margin-top: 18px;
    height: 2px;
    background: var(--line);
    position: relative;
    overflow: hidden;
  }
  .prog-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold-bright));
    transition: width 0.7s cubic-bezier(.4,1,.4,1);
  }

  /* ===== CONTROLS ===== */
  .controls {
    padding: 18px 18px 6px;
    display: flex;
    gap: 10px;
    align-items: stretch;
  }

  .search-wrap { flex: 1; position: relative; }

  .search {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ivory);
    padding: 12px 14px 12px 40px;
    border-radius: 2px;
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    font-weight: 300;
    letter-spacing: 1px;
    -webkit-appearance: none;
  }
  .search:focus { outline: none; border-color: var(--gold-dim); }
  .search::placeholder { color: var(--ash-dim); text-transform: uppercase; font-size: 12px; letter-spacing: 2px; }

  .search-icon {
    position: absolute; left: 14px; top: 50%;
    transform: translateY(-50%);
    color: var(--gold-dim); font-size: 14px; pointer-events: none;
  }

  .filter-btn {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ash);
    border-radius: 2px;
    cursor: pointer;
    padding: 0 16px;
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: 'Oswald', sans-serif;
    transition: all 0.2s;
  }
  .filter-btn .filter-label {
    font-size: 11px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; white-space: nowrap;
  }
  .filter-btn.active {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--bg);
  }

  /* ===== SPECIAL PANEL ===== */
  .special-panel {
    margin: 16px 18px 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .special-box {
    background: #fbf4e2;
    border: 1.5px solid var(--gold-dim);
    border-radius: 10px;
    padding: 12px 13px 13px;
  }

  .special-box.empty { opacity: 0.5; }

  .special-box-head {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 9px;
    padding-bottom: 8px;
    border-bottom: 1px solid rgba(168,132,47,0.25);
  }
  .special-box-head .sp-ico { font-size: 16px; }
  .special-box-head .sp-title {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gold);
  }
  .special-box-head .sp-count {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--gold);
  }

  .special-codes {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .sp-chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    background: #fff;
    border: 1px solid var(--gold-dim);
    color: var(--ivory);
    padding: 3px 7px;
    border-radius: 20px;
    letter-spacing: 0.5px;
  }
  .special-codes .none {
    font-family: 'Oswald', sans-serif;
    font-size: 11px;
    color: var(--ash-dim);
    font-style: italic;
    letter-spacing: 0.5px;
  }

  /* section label */
  .legend {
    display: flex;
    gap: 18px;
    padding: 8px 22px 0;
  }
  .legend-item {
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 1px;
    color: var(--ash);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .section-label {
    padding: 16px 22px 4px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .section-label .txt {
    font-size: 10px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase; color: var(--ash);
  }
  .section-label .rule { flex: 1; height: 1px; background: var(--line-soft); }

  /* ===== TEAM ENTRIES ===== */
  .list { padding: 4px 18px 0; }

  .team {
    border-bottom: 1px solid var(--line-soft);
    padding: 18px 0;
    transition: opacity 0.4s;
  }
  .team.done { opacity: 0.4; }

  .team-head {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 14px;
  }

  .team-flag {
    font-size: 26px;
    line-height: 1;
    filter: saturate(0.85) contrast(1.05);
    flex-shrink: 0;
  }

  .team-rank {
    font-family: 'Bodoni Moda', serif;
    font-size: 11px;
    font-style: italic;
    color: var(--gold-dim);
    width: 22px;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }

  .team-info { flex: 1; min-width: 0; }
  .team-code {
    font-family: 'Bodoni Moda', serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 1px;
    line-height: 1;
    color: var(--ivory);
  }
  .team-name {
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--ash-dim);
    margin-top: 5px;
  }
  .team-page {
    display: inline-block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0;
    text-transform: none;
    color: var(--gold);
    background: #fbf4e2;
    border: 1px solid var(--gold-dim);
    border-radius: 20px;
    padding: 1px 8px;
    margin-left: 6px;
    vertical-align: middle;
  }

  .team-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0;
    color: #fff;
    background: var(--crimson);
    border-radius: 20px;
    padding: 2px 9px;
    vertical-align: middle;
    margin-left: 4px;
    position: relative;
    top: -2px;
  }
  .team.done .team-badge {
    background: var(--emerald);
  }

  .casilleros {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    padding-left: 36px;
  }

  .casillero {
    background: var(--crimson-soft);
    border: 1px solid rgba(176,58,58,0.3);
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: all 0.18s cubic-bezier(.4,1.4,.5,1);
    position: relative;
    min-height: 42px;
  }

  .casillero:active { transform: scale(0.96); }

  .cas-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    color: var(--crimson);
    flex-shrink: 0;
    min-width: 22px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  .cas-name {
    font-family: 'Oswald', sans-serif;
    font-size: 11.5px;
    font-weight: 400;
    color: var(--ash);
    line-height: 1.15;
    letter-spacing: 0.2px;
  }

  .casillero.got {
    background: var(--emerald-soft);
    border-color: rgba(61,122,90,0.4);
  }
  .casillero.got .cas-num { color: var(--emerald); }
  .casillero.got .cas-name { color: var(--emerald); text-decoration: line-through; }
  .casillero.got::after {
    content: '✓';
    position: absolute;
    right: 8px; top: 50%;
    transform: translateY(-50%);
    font-size: 13px; color: var(--emerald);
    font-weight: 700;
  }

  /* Especiales: escudo (N1) y foto equipo (N13) */
  .casillero.special {
    border-width: 1.5px;
    border-color: var(--gold);
    background: #fbf4e2;
  }
  .casillero.special .cas-num { color: var(--gold); }
  .casillero.special .cas-name { color: var(--gold-dim); }
  .casillero.special.got { background: var(--emerald-soft); border-color: var(--emerald); }
  .casillero.special.got .cas-num,
  .casillero.special.got .cas-name { color: var(--emerald); }

  .casillero.shield .cas-num::before { content: '🛡️ '; }
  .casillero.squad .cas-num::before { content: '📸 '; }

  .hidden { display: none !important; }

  /* ===== TOTALS FOOTER ===== */
  .totals {
    margin: 22px 18px 8px;
    background: #fbf8f0;
    border: 1.5px solid var(--gold-dim);
    border-radius: 14px;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .totals-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .totals-lbl {
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--ash);
  }
  .totals-val {
    font-family: 'Anton', sans-serif;
    font-size: 30px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .totals-val.faltan { color: var(--crimson); }
  .totals-val.tengo { color: var(--emerald); }

  /* ===== FUN SHARE BAR ===== */
  .share-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0), #ffffff 38%);
    padding: 18px 16px calc(var(--safe-bottom) + 14px);
    z-index: 40;
    display: flex;
    justify-content: center;
  }

  .share-btn {
    background: linear-gradient(135deg, #ff8a3d 0%, #ff4d6d 55%, #c8a24a 130%);
    color: #fff;
    border: none;
    border-radius: 30px;
    padding: 12px 22px;
    font-family: 'Oswald', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.3px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 6px 18px rgba(255,77,109,0.35);
    transition: transform 0.14s cubic-bezier(.3,1.6,.5,1);
    position: relative;
    overflow: hidden;
  }
  .share-btn::after {
    content: '';
    position: absolute;
    top: 0; left: -60%;
    width: 40%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
    transform: skewX(-20deg);
    animation: shine 3.2s ease-in-out infinite;
  }
  @keyframes shine { 0%,100% { left: -60%; } 50% { left: 120%; } }

  .share-btn:active { transform: scale(0.95); }
  .share-btn .ico { font-size: 17px; }
  .share-btn .arrow { font-size: 15px; font-weight: 700; }
  .share-btn .share-txt { font-weight: 600; }

  /* ===== SHEET ===== */
  .sheet-bg {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    display: none; align-items: flex-end; justify-content: center;
    z-index: 100; opacity: 0; transition: opacity 0.25s;
  }
  .sheet-bg.open { display: flex; opacity: 1; }

  .sheet {
    background: var(--bg-2);
    border-top: 1px solid var(--gold-dim);
    border-radius: 4px 4px 0 0;
    padding: 8px 20px calc(var(--safe-bottom) + 20px);
    width: 100%; max-width: 520px;
    transform: translateY(100%);
    transition: transform 0.32s cubic-bezier(.3,1,.4,1);
    max-height: 86vh; overflow-y: auto;
  }
  .sheet-bg.open .sheet { transform: translateY(0); }

  .sheet-grip { width: 40px; height: 3px; background: var(--line); border-radius: 2px; margin: 6px auto 18px; }

  .sheet-title {
    font-family: 'Bodoni Moda', serif;
    font-size: 22px; font-weight: 700; margin-bottom: 4px;
  }
  .sheet-sub {
    font-size: 11px; font-weight: 300; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--ash); margin-bottom: 20px;
  }

  .sheet-opt {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 15px 16px;
    font-family: 'Oswald', sans-serif;
    cursor: pointer; width: 100%; text-align: left;
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 14px;
    transition: all 0.18s;
    color: var(--ivory);
  }
  .sheet-opt:active { transform: scale(0.98); border-color: var(--gold-dim); }

  .sheet-opt .opt-ico {
    width: 36px; height: 36px; border-radius: 2px;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; flex-shrink: 0;
    border: 1px solid var(--line);
    background: var(--bg);
  }
  .sheet-opt .opt-body { flex: 1; }
  .sheet-opt .opt-name { font-size: 14px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; line-height: 1.2; }
  .sheet-opt .opt-desc { font-size: 10px; font-weight: 300; letter-spacing: 1px; color: var(--ash-dim); margin-top: 3px; text-transform: uppercase; }

  .sheet-opt.danger .opt-name { color: var(--crimson); }

  .sheet-cancel {
    background: transparent; border: 1px solid var(--line);
    border-radius: 2px; padding: 15px; width: 100%; margin-top: 6px;
    font-family: 'Oswald', sans-serif; font-size: 12px; font-weight: 500;
    letter-spacing: 2px; text-transform: uppercase; color: var(--ash); cursor: pointer;
  }

  .sheet-divider {
    font-size: 9px; font-weight: 500; letter-spacing: 3px; text-transform: uppercase;
    color: var(--ash-dim); margin: 14px 2px 12px;
    display: flex; align-items: center; gap: 10px;
  }
  .sheet-divider::after { content: ''; flex: 1; height: 1px; background: var(--line-soft); }

  /* Toast */
  .toast {
    position: fixed; bottom: 100px; left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--gold); color: var(--bg);
    padding: 12px 22px; border-radius: 2px;
    font-family: 'Oswald', sans-serif;
    font-size: 12px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase;
    z-index: 200; opacity: 0; pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* page-load reveal */
  .team { animation: rise 0.5s cubic-bezier(.2,.8,.3,1) backwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
</style>
</head>
<body>

<div class="header">
  <div class="eyebrow">
    <div class="eyebrow-line"></div>
    <div class="eyebrow-text">FIFA World Cup 2026</div>
    <div class="eyebrow-line"></div>
  </div>

  <div class="masthead">
    <div class="name">MATU AGUILA</div>
    <div class="sub">Mi álbum del Mundial</div>
  </div>
</div>

<div id="specialPanel" class="special-panel"></div>

<div class="controls">
  <div class="search-wrap">
    <span class="search-icon">⌕</span>
    <input type="text" class="search" id="search" placeholder="Buscar selección" autocomplete="off" autocorrect="off" autocapitalize="off">
  </div>
</div>

<div class="section-label">
  <span class="txt">Selecciones · Faltantes</span>
  <span class="rule"></span>
</div>

<div class="legend">
  <span class="legend-item">🛡️ Escudo</span>
  <span class="legend-item">📸 Foto de equipo</span>
</div>

<div class="list" id="teamsContainer"></div>

<div class="totals" id="totals">
  <div class="totals-row">
    <span class="totals-lbl">Me faltan</span>
    <span class="totals-val faltan" id="totFaltan">0</span>
  </div>
  <div class="totals-row">
    <span class="totals-lbl">Ya tengo</span>
    <span class="totals-val tengo" id="totTengo">0</span>
  </div>
</div>

<div class="share-bar">
  <button class="share-btn" id="shareBtn">
    <span class="ico">⚽</span>
    <span class="share-txt">Mandar mi lista</span>
  </button>
</div>

<div class="sheet-bg" id="shareSheet">
  <div class="sheet">
    <div class="sheet-grip"></div>
    <div class="sheet-title">Compartir</div>
    <div class="sheet-sub">Distribuir lista de faltantes</div>

    <button class="sheet-opt" id="optWhatsapp">
      <span class="opt-ico">✆</span>
      <span class="opt-body">
        <span class="opt-name">WhatsApp</span>
        <span class="opt-desc">Mensaje listo para enviar</span>
      </span>
    </button>

    <button class="sheet-opt" id="optShare">
      <span class="opt-ico">⇪</span>
      <span class="opt-body">
        <span class="opt-name">Más opciones</span>
        <span class="opt-desc">Mensajes · Mail · Notas</span>
      </span>
    </button>

      players: {20:''} },
    { name: 'Colombia',        code: 'COL', page: 96, flag: '🇨🇴', missing: [5,7,11,18],
      players: {5:'', 7:'', 11:'', 18:''} },
    { name: 'Inglaterra',      code: 'ENG', page: 98, flag: '🏴󠁧󠁢󠁥󠁮󠁧󠁿', missing: [14,19],
      players: {14:'', 19:''} },
    { name: 'Croacia',         code: 'CRO', page: 100, flag: '🇭🇷', missing: [5],
      players: {5:''} },
    { name: 'Ghana',           code: 'GHA', page: 102, flag: '🇬🇭', missing: [3,9],
      players: {3:'', 9:''} },
    { name: 'Panamá',          code: 'PAN', page: 104, flag: '🇵🇦', missing: [9,13],
      players: {9:'', 13:'Foto de equipo'} },
    { name: 'Copa del Mundo',  code: 'FWC', page: 0, flag: '🏆', missing: [1,11,12],
      players: {1:'Emblema', 11:'', 12:''} },
  ];

  const TOTAL_STICKERS = teamsData.length * 20;
  const STORAGE_KEY = 'figuritas_matu_v4';

  let gotSet = new Set();

  function saveProgress() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ got: [...gotSet] })); } catch(e) {}
  }
  function loadProgress() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) { const d = JSON.parse(raw); gotSet = new Set(d.got || []); }
    } catch(e) {}
  }
  function keyFor(t, n) { return t + ':' + n; }
  function remainingFor(team) { return team.missing.filter(n => !gotSet.has(keyFor(team.name, n))); }
  function totalMissing() { let t=0; teamsData.forEach(x=>t+=x.missing.length); return t; }
  function currentMissing() { return totalMissing() - gotSet.size; }
  function currentHave() { return TOTAL_STICKERS - currentMissing(); }

  let hideCompleted = false;
  let searchTerm = '';

  function buildSpecialPanel() {
    const shields = [];
    const squads = [];
    teamsData.forEach(team => {
      if (team.missing.includes(1) && !gotSet.has(keyFor(team.name, 1))) {
        shields.push(team.code);
      }
      if (team.missing.includes(13) && !gotSet.has(keyFor(team.name, 13))) {
        squads.push(team.code);
      }
    });

    const chip = arr => arr.length
      ? arr.map(c => `<span class="sp-chip">${c}</span>`).join('')
      : '<span class="none">¡Todos! 🎉</span>';

    document.getElementById('specialPanel').innerHTML = `
      <div class="special-box${shields.length?'':' empty'}">
        <div class="special-box-head">
          <span class="sp-ico">🛡️</span>
          <span class="sp-title">Escudos</span>
          <span class="sp-count">${shields.length}</span>
        </div>
        <div class="special-codes">${chip(shields)}</div>
      </div>
      <div class="special-box${squads.length?'':' empty'}">
        <div class="special-box-head">
          <span class="sp-ico">📸</span>
          <span class="sp-title">Equipos</span>
          <span class="sp-count">${squads.length}</span>
        </div>
        <div class="special-codes">${chip(squads)}</div>
      </div>
    `;
  }

  function build() {
    const container = document.getElementById('teamsContainer');
    container.innerHTML = '';

    teamsData.forEach((team, idx) => {
      const card = document.createElement('div');
      card.className = 'team';
      card.dataset.team = team.name.toLowerCase();
      card.dataset.code = team.code.toLowerCase();
      card.style.animationDelay = (Math.min(idx, 12) * 0.025) + 's';

      const head = document.createElement('div');
      head.className = 'team-head';
      const rank = String(idx + 1).padStart(2, '0');
      head.innerHTML =
        `<span class="team-rank">${rank}</span>
         <span class="team-flag">${team.flag}</span>
         <span class="team-info">
           <span class="team-code">${team.code} <span class="team-badge"></span></span>
           <span class="team-name">${team.name}${team.page ? ` <span class="team-page">pág. ${team.page}</span>` : ''}</span>
         </span>`;
      card.appendChild(head);

      const grid = document.createElement('div');
      grid.className = 'casilleros';
      team.missing.forEach(num => grid.appendChild(makeCell(team, num)));
      card.appendChild(grid);

      container.appendChild(card);
      updateCounter(team, card);
    });

    applyFilter();
    buildSpecialPanel();
  }

  function makeCell(team, num) {
    const cell = document.createElement('div');
    cell.className = 'casillero';
    cell.dataset.num = num;

    // Determinar etiqueta de la figurita
    let label = '';
    if (num === 1) {
      cell.classList.add('special', 'shield');
      label = team.code === 'FWC' ? 'Copa' : 'Escudo';
    } else if (num === 13) {
      cell.classList.add('special', 'squad');
      label = 'Foto de equipo';
    } else if (team.players && team.players[num]) {
      label = team.players[num];
    }

    cell.innerHTML = `<span class="cas-num">${num}</span>` +
      (label ? `<span class="cas-name">${label}</span>` : '');

    refreshCellState(cell, team, num);
    cell.addEventListener('click', () => handleTap(team, num, cell));
    return cell;
  }

  function refreshCellState(cell, team, num) {
    const k = keyFor(team.name, num);
    cell.classList.toggle('got', gotSet.has(k));
  }

  function handleTap(team, num, cell) {
    const k = keyFor(team.name, num);
    if (gotSet.has(k)) gotSet.delete(k); else gotSet.add(k);
    refreshCellState(cell, team, num);
    const card = document.querySelector(`.team[data-team="${team.name.toLowerCase()}"]`);
    if (card) updateCounter(team, card);
    saveProgress();
    updateStats();
    applyFilter();
    buildSpecialPanel();
  }

  function updateCounter(team, card) {
    const badge = card.querySelector('.team-badge');
    const remaining = remainingFor(team);
    if (remaining.length === 0) {
      badge.textContent = '✓';
      card.classList.add('done');
    } else {
      badge.textContent = remaining.length;
      card.classList.remove('done');
    }
  }

  function updateStats() {
    const totalLista = totalMissing();       // suma de toda la lista de faltantes
    const tengo = gotSet.size;               // las que ya consiguió (tachadas)
    const faltan = totalLista - tengo;       // las que todavía le faltan
    const elF = document.getElementById('totFaltan');
    const elT = document.getElementById('totTengo');
    if (elF) elF.textContent = faltan;
    if (elT) elT.textContent = tengo;
  }

  function applyFilter() {
    document.querySelectorAll('.team').forEach(card => {
      const team = teamsData.find(t => t.name.toLowerCase() === card.dataset.team);
      const remaining = remainingFor(team).length;
      const matchesSearch = !searchTerm || card.dataset.team.includes(searchTerm) || card.dataset.code.includes(searchTerm);
      const matchesFilter = !hideCompleted || remaining > 0;
      card.classList.toggle('hidden', !(matchesSearch && matchesFilter));
    });
  }

  function buildFaltanText() {
    let txt = '⚽ Estas son las que me faltan para terminar mi álbum:\n\n';
    teamsData.forEach(team => {
      const r = remainingFor(team);
      if (r.length > 0) txt += `${team.flag} *${team.code}*: ${r.join(', ')}\n`;
    });
    txt += '\n¿Tenés alguna? ¡Juntemos el álbum! 🙌';
    return txt;
  }
  function currentText() { return buildFaltanText(); }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(()=>t.classList.remove('show'), 2000);
  }

  async function copyText(text, msg) {
    try { await navigator.clipboard.writeText(text); showToast(msg || 'Copiado'); }
    catch(e) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); showToast(msg || 'Copiado'); } catch(e2) {}
      document.body.removeChild(ta);
    }
  }

  document.getElementById('search').addEventListener('input', e => {
    searchTerm = e.target.value.toLowerCase().trim(); applyFilter();
  });

  const sheet = document.getElementById('shareSheet');
  document.getElementById('shareBtn').addEventListener('click', () => sheet.classList.add('open'));
  document.getElementById('optCancel').addEventListener('click', () => sheet.classList.remove('open'));
  sheet.addEventListener('click', e => { if (e.target === sheet) sheet.classList.remove('open'); });

  document.getElementById('optWhatsapp').addEventListener('click', async () => {
    const text = currentText(); sheet.classList.remove('open');
    try { await navigator.clipboard.writeText(text); } catch(e) {}
    window.location.href = 'whatsapp://send?text=' + encodeURIComponent(text);
  });

  document.getElementById('optShare').addEventListener('click', async () => {
    const text = currentText(); sheet.classList.remove('open');
    if (navigator.share) { try { await navigator.share({ text }); return; } catch(err) { if (err.name==='AbortError') return; } }
    copyText(text, 'Copiado');
  });

  document.getElementById('optCopy').addEventListener('click', () => {
    copyText(currentText(), 'Copiado'); sheet.classList.remove('open');
  });

  document.getElementById('optReset').addEventListener('click', () => {
    if (confirm('¿Reiniciar el progreso?')) {
      gotSet.clear(); saveProgress(); build(); updateStats();
      sheet.classList.remove('open'); showToast('Reiniciado');
    }
  });

  loadProgress();
  build();
  updateStats();
</script>
